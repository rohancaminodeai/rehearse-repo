services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inbody
      POSTGRES_PASSWORD: inbody
      POSTGRES_DB: inbody
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inbody"]
      interval: 3s
      timeout: 3s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://inbody:inbody@db:5432/inbody
      TRAINER_PASSWORD: ${TRAINER_PASSWORD:-trainer123}
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-me}
      UPLOAD_DIR: /data/uploads
    ports:
      - "3000:3000"
    volumes:
      - uploads:/data/uploads

volumes:
  pgdata:
  uploads:
